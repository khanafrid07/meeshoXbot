services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_afridxmeesho
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Optional web GUI for viewing your MongoDB data in the browser at http://localhost:8081
  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_afridxmeesho
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongo_data:

